<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuelTrack Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
  body {
    background: radial-gradient(circle at top, #0a0f1f, #000);
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
  }
  .glass {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  }
  input:disabled, button:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin:0; }
  input[type=number]{ -moz-appearance: textfield; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen">

<!-- LANDING PAGE -->
<div id="landingPage" class="text-center">
  <h1 class="text-5xl font-bold text-cyan-400 mb-4">⛽ FuelTrack Pro</h1>
  <p class="mb-6 text-gray-300 text-lg">Smart Fuel Management for Your Fleet</p>
  <button onclick="goToLogin()" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition-transform hover:scale-105">🚗 Login</button>
</div>

<!-- LOGIN PAGE -->
<div id="loginBox" class="glass p-10 max-w-md w-full text-center hidden">
  <h1 class="text-3xl font-bold text-cyan-400 mb-6">Car Login</h1>
  <input type="text" id="carId" placeholder="Enter Car Number" class="w-full mb-4 px-4 py-3 rounded bg-gray-800 text-white"/>
  <input type="password" id="carPassword" placeholder="Enter Password" class="w-full mb-4 px-4 py-3 rounded bg-gray-800 text-white"/>
  <button onclick="login()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded-lg transition-transform hover:scale-105">Login</button>
  <p id="loginMsg" class="text-red-400 mt-2 hidden">❌ Invalid Car Number or Password</p>
  <button onclick="backToLanding()" class="mt-6 bg-gray-700 hover:bg-gray-800 px-6 py-2 rounded">⬅ Back</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden max-w-6xl w-full mx-auto p-10 glass flex flex-wrap gap-6">

  <!-- Left Panel: Car Info -->
  <div class="flex-1 min-w-[220px] bg-gray-900 p-4 rounded-lg">
    <h2 class="text-xl font-bold text-cyan-300 mb-4 text-center">Car Info</h2>
    <p><strong>Car Number:</strong> <span id="dCarId"></span></p>
    <p><strong>Status:</strong> <span id="dStatus"></span></p>
    <p><strong>Remaining Fuel:</strong> <span id="dFuelLimit"></span></p>
    <p><strong>Current KM:</strong> <span id="dKm"></span></p>
  </div>

  <!-- Middle Panel: KM + Driver Info -->
  <div class="flex-1 min-w-[220px] bg-gray-900 p-4 rounded-lg flex flex-col gap-3">
    <h2 class="text-xl font-bold text-cyan-300 text-center">Driver Input</h2>

    <!-- Kilometer Section -->
    <input type="number" id="kilometerInput" placeholder="Current Kilometer" class="px-4 py-2 rounded bg-gray-800 text-white"/>
    <button id="updateKmBtn" onclick="startKmUpdate()" class="bg-yellow-500 hover:bg-yellow-600 px-3 py-2 rounded">Update KM & Capture Photo</button>
    <p id="kmMsg" class="text-green-300 mt-1"></p>

    <!-- Camera Preview -->
    <div id="cameraBox" class="hidden flex flex-col items-center mt-2">
      <video id="video" width="200" autoplay></video>
      <button onclick="takePhoto()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded mt-2">Capture Photo</button>
      <canvas id="photoCanvas" width="200" height="150" class="mt-2 border border-gray-400"></canvas>
    </div>

    <!-- Driver Info & Fuel -->
    <input type="text" id="driverName" placeholder="Driver Name" class="px-4 py-2 rounded bg-gray-800 text-white" disabled/>
    <input type="text" id="driverPhone" placeholder="Driver Phone" class="px-4 py-2 rounded bg-gray-800 text-white" disabled/>
    <input type="number" id="litersInput" placeholder="Liters Filled" class="px-4 py-2 rounded bg-gray-800 text-white" disabled/>
    <button id="submitQRBtn" onclick="submitRefill()" class="bg-cyan-500 hover:bg-cyan-600 px-3 py-2 rounded mt-2" disabled>Submit & Generate QR</button>

    <!-- Logout Button -->
    <button onclick="logout()" class="mt-4 bg-red-500 hover:bg-red-600 px-6 py-2 rounded">⬅ Logout</button>
  </div>

  <!-- Right Panel: QR & History -->
  <div class="flex-1 min-w-[220px] bg-gray-900 p-4 rounded-lg flex flex-col items-center">
    <h2 class="text-xl font-bold text-cyan-300 mb-4 text-center">QR & History</h2>
    <canvas id="qrCanvas"></canvas>
    <div id="qrInfo" class="mt-3 text-cyan-200 text-center max-h-64 overflow-y-auto w-full"></div>
  </div>

</div>

<script>
const pricePerLiter = 280;
let cars = {};
for(let i=1;i<=50;i++){
  let id = (1000+i).toString();
  cars[id] = { fuelLimit: 300, km:0, status: "OFF", lastKmUpdate:null, history: [], photo: null };
}
cars["1010"].status="ON";
cars["1015"].status="ON";

let currentCar = null;
let videoStream;

// Navigation
function goToLogin() { document.getElementById("landingPage").classList.add("hidden"); document.getElementById("loginBox").classList.remove("hidden"); }
function backToLanding() { document.getElementById("loginBox").classList.add("hidden"); document.getElementById("landingPage").classList.remove("hidden"); document.getElementById("carId").value=""; document.getElementById("carPassword").value=""; document.getElementById("loginMsg").classList.add("hidden"); }

// Login
function login() {
  const carId = document.getElementById("carId").value.trim();
  const carPass = document.getElementById("carPassword").value.trim();
  const car = cars[carId];
  if(!car || carPass!=="123450"){ document.getElementById("loginMsg").classList.remove("hidden"); return; }
  currentCar = carId;
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("driverName").value=""; document.getElementById("driverPhone").value=""; document.getElementById("litersInput").value="";
  document.getElementById("kilometerInput").value=""; document.getElementById("qrCanvas").getContext("2d").clearRect(0,0,200,200);
  document.getElementById("qrInfo").innerHTML=""; document.getElementById("kmMsg").innerText="";
  document.getElementById("driverName").disabled=true; document.getElementById("driverPhone").disabled=true; document.getElementById("litersInput").disabled=true; document.getElementById("submitQRBtn").disabled=true;
  showDashboard();
}

// Show dashboard
function showDashboard(){
  const car = cars[currentCar];
  document.getElementById("dCarId").innerText = currentCar;
  document.getElementById("dStatus").innerText = car.status;
  document.getElementById("dFuelLimit").innerText = car.fuelLimit + " L";
  document.getElementById("dKm").innerText = car.km;
  const historyDiv = document.getElementById("qrInfo");
  if(car.history.length>0){
    historyDiv.innerHTML = car.history.map(entry => `<div class="mb-2 p-2 border-b border-gray-700"><p>${entry.date}: ${entry.liters} L, KM: ${entry.km}, Driver: ${entry.driverName}</p>${entry.photo?`<img src="${entry.photo}" width="100" class="rounded mt-1">`:''}</div>`).join('');
  } else historyDiv.innerHTML = "<p class='text-gray-400'>No history yet</p>";
}

// Start KM update & open camera
function startKmUpdate() {
  const km = parseInt(document.getElementById("kilometerInput").value);
  if(isNaN(km)){ document.getElementById("kmMsg").innerText="⚠ Enter KM!"; return; }
  document.getElementById("cameraBox").classList.remove("hidden");
  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { videoStream = stream; document.getElementById("video").srcObject = stream; }).catch(err => alert("Camera access denied!"));
}

// Capture photo & unlock driver inputs
function takePhoto(){
  const video = document.getElementById("video"); const canvas = document.getElementById("photoCanvas"); const ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0,canvas.width,canvas.height); videoStream.getTracks().forEach(track=>track.stop());
  document.getElementById("cameraBox").classList.add("hidden");
  const photoBase64 = canvas.toDataURL("image/png");
  const km = parseInt(document.getElementById("kilometerInput").value);
  const car = cars[currentCar]; car.km = km; car.lastKmUpdate = new Date(); car.photo = photoBase64;
  document.getElementById("kmMsg").innerText = "✅ KM updated with photo!";
  document.getElementById("driverName").disabled=false; document.getElementById("driverPhone").disabled=false;
  document.getElementById("litersInput").disabled=false; document.getElementById("submitQRBtn").disabled=false;
  showDashboard();
}

// Submit refill & generate QR
function submitRefill(){
  const car = cars[currentCar];
  let liters = parseFloat(document.getElementById("litersInput").value);
  let km = parseInt(document.getElementById("kilometerInput").value);
  let driverName = document.getElementById("driverName").value.trim();
  let driverPhone = document.getElementById("driverPhone").value.trim();
  if(!liters||!km||!driverName||!driverPhone){ alert("Fill all fields!"); return; }
  if(liters>car.fuelLimit){ alert("Fuel limit exceeded!"); return; }
  car.fuelLimit -= liters; car.km = km; car.lastKmUpdate = new Date();
  const amount = liters*pricePerLiter;
  const qrData = {carId:currentCar, driverName, driverPhone, liters, km, amount, date:new Date().toLocaleString(), photo:car.photo};
  car.history.push({...qrData});
  QRCode.toCanvas(document.getElementById("qrCanvas"), JSON.stringify(qrData), {width:200}, function(err){
    if(err) console.error(err);
    document.getElementById("qrInfo").innerHTML = `<p>✅ Scan QR for Payment</p><p>Amount: Rs ${amount}</p><p>Remaining Limit: ${car.fuelLimit} L</p>${car.photo?`<img src="${car.photo}" width="150" class="rounded mt-2"/>`:''}`;
  });
  showDashboard();
}

// Logout
function logout(){ currentCar=null; document.getElementById("dashboard").classList.add("hidden"); document.getElementById("loginBox").classList.remove("hidden"); document.getElementById("carId").value=""; document.getElementById("carPassword").value=""; document.getElementById("loginMsg").classList.add("hidden"); }
</script>
</body>
</html>
